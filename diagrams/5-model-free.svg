<rect x="70" y="100" width="380" height="74" rx="10" fill="#161b22"/><rect x="70" y="100" width="380" height="74" rx="10" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1.5"/>
<text x="260.0" y="125.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Random calls</text>
<text x="260.0" y="144.0" text-anchor="middle" font-size="12" fill="#9da7b3">400 per run: random enum members and pool values,</text>
<text x="260.0" y="161.0" text-anchor="middle" font-size="12" fill="#9da7b3">random routing, placeholder lines</text>
<rect x="70" y="214" width="380" height="44" rx="10" fill="#161b22"/><rect x="70" y="214" width="380" height="44" rx="10" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1.5"/>
<text x="260.0" y="241.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Snapshot of every step a call waits in</text>
<rect x="70" y="298" width="380" height="65" rx="10" fill="#161b22"/><rect x="70" y="298" width="380" height="65" rx="10" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1.5"/>
<text x="260.0" y="327.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Continue with a stuck customer</text>
<text x="260.0" y="346.0" text-anchor="middle" font-size="12" fill="#9da7b3">repeat · silent · none · broken · bye</text>
<rect x="550" y="100" width="380" height="74" rx="10" fill="#161b22"/><rect x="550" y="100" width="380" height="74" rx="10" fill="#58a6ff" fill-opacity="0.13" stroke="#58a6ff" stroke-width="1.5"/>
<text x="740.0" y="133.5" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Recordings of the last local test round</text>
<text x="740.0" y="152.5" text-anchor="middle" font-size="12" fill="#9da7b3">what each customer said, what was extracted</text>
<rect x="550" y="214" width="380" height="44" rx="10" fill="#161b22"/><rect x="550" y="214" width="380" height="44" rx="10" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1.5"/>
<text x="740.0" y="241.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">replay: the same turns again</text>
<rect x="550" y="298" width="380" height="65" rx="10" fill="#161b22"/><rect x="550" y="298" width="380" height="65" rx="10" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1.5"/>
<text x="740.0" y="327.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">mutate and deep</text>
<text x="740.0" y="346.0" text-anchor="middle" font-size="12" fill="#9da7b3">a passed call + one disturbance · up to turn k, then stuck</text>
<rect x="70" y="420" width="860" height="88" rx="10" fill="#161b22"/><rect x="70" y="420" width="860" height="88" rx="10" fill="#d29922" fill-opacity="0.13" stroke="#d29922" stroke-width="1.5"/>
<text x="500.0" y="452.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Checks that hold for every brief</text>
<text x="500.0" y="471.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9da7b3">NO_END  NO_CLOSE  REPEAT  STUCK  CODE_ERROR  ENUM_WRITE  NO_URL  BAD_CALL</text>
<text x="500.0" y="488.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9da7b3">BAD_PROMISE  HONESTY  GOODBYE  TEMPLATE  SILENT_TURN  BYE_IGNORED  MUTATION  REGRESSION</text>
<rect x="70" y="556" width="500" height="74" rx="10" fill="#161b22"/><rect x="70" y="556" width="500" height="74" rx="10" fill="#8b949e" fill-opacity="0.13" stroke="#8b949e" stroke-width="1.5"/>
<text x="320.0" y="581.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">fuzz-N.md</text>
<text x="320.0" y="600.0" text-anchor="middle" font-size="12" fill="#9da7b3">one group per defect, with the shortest run that shows it</text>
<text x="320.0" y="617.0" text-anchor="middle" font-size="12" fill="#9da7b3">+ selftest.py result + brief items not found (check_rules.py)</text>
<rect x="120" y="676" width="400" height="65" rx="10" fill="#161b22"/><rect x="120" y="676" width="400" height="65" rx="10" fill="#a371f7" fill-opacity="0.13" stroke="#a371f7" stroke-width="1.5"/>
<text x="320.0" y="705.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Repair turn</text>
<text x="320.0" y="724.0" text-anchor="middle" font-size="12" fill="#9da7b3">a defect group counts like a failed customer</text>
<text x="610" y="586" text-anchor="start" font-size="12" fill="#9da7b3">Disturbances: a cut-off message, nothing</text>
<text x="610" y="603" text-anchor="start" font-size="12" fill="#9da7b3">extracted, a garbage value, a side question.</text>
<text x="610" y="629" text-anchor="start" font-size="12" fill="#e6edf3">Exact findings, not a model's opinion.</text>
<rect x="32" y="766" width="12" height="12" rx="3" fill="#a371f7" fill-opacity="0.25" stroke="#a371f7" stroke-width="1.5"/><text x="50" y="777" font-size="11" fill="#9da7b3">Claude session or model role</text>
<rect x="240.0" y="766" width="12" height="12" rx="3" fill="#3fb950" fill-opacity="0.25" stroke="#3fb950" stroke-width="1.5"/><text x="258.0" y="777" font-size="11" fill="#9da7b3">plain Python, no model</text>
<rect x="412.0" y="766" width="12" height="12" rx="3" fill="#58a6ff" fill-opacity="0.25" stroke="#58a6ff" stroke-width="1.5"/><text x="430.0" y="777" font-size="11" fill="#9da7b3">simulation / test round</text>
<rect x="590.0" y="766" width="12" height="12" rx="3" fill="#d29922" fill-opacity="0.25" stroke="#d29922" stroke-width="1.5"/><text x="608.0" y="777" font-size="11" fill="#9da7b3">decision</text>
<rect x="678.0" y="766" width="12" height="12" rx="3" fill="#8b949e" fill-opacity="0.25" stroke="#8b949e" stroke-width="1.5"/><text x="696.0" y="777" font-size="11" fill="#9da7b3">files</text>
