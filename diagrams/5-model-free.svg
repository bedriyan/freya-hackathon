<text x="32" y="42" font-size="20" font-weight="700" fill="#e6edf3">The model-free test</text>
<text x="32" y="64" font-size="13" fill="#9da7b3">fuzz_workflow.py. The same engine and bank; the three model roles are replaced by a random generator or a recording.</text>
