<text x="500.0" y="329.0" text-anchor="middle" font-size="12" fill="#9da7b3">2  deterministic conditions on variables, no model</text>
<text x="500.0" y="346.0" text-anchor="middle" font-size="12" fill="#9da7b3">3  intent conditions, one model call for all of them</text>
<text x="500.0" y="363.0" text-anchor="middle" font-size="12" fill="#9da7b3">4  global steps</text>
