<text x="240.0" y="529.0" text-anchor="middle" font-size="12" fill="#9da7b3">or a line and a tool call</text>
<rect x="590" y="468" width="340" height="74" rx="10" fill="#161b22"/><rect x="590" y="468" width="340" height="74" rx="10" fill="#58a6ff" fill-opacity="0.13" stroke="#58a6ff" stroke-width="1.5"/>
