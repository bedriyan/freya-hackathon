<text x="240.0" y="788.0" text-anchor="middle" font-size="12" fill="#9da7b3">wait for the next message</text>
<rect x="590" y="740" width="340" height="65" rx="10" fill="#161b22"/><rect x="590" y="740" width="340" height="65" rx="10" fill="#f0883e" fill-opacity="0.13" stroke="#f0883e" stroke-width="1.5"/>
