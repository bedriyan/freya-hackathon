<text x="760.0" y="529.0" text-anchor="middle" font-size="12" fill="#9da7b3">then by step type</text>
<rect x="70" y="612" width="340" height="74" rx="10" fill="#161b22"/><rect x="70" y="612" width="340" height="74" rx="10" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1.5"/>
<text x="240.0" y="637.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Bank tool</text>
<text x="240.0" y="656.0" text-anchor="middle" font-size="12" fill="#9da7b3">pre hook → bank → post hook</text>
<text x="240.0" y="673.0" text-anchor="middle" font-size="12" fill="#9da7b3">→ response mapping into variables</text>
<rect x="590" y="612" width="340" height="74" rx="10" fill="#161b22"/><rect x="590" y="612" width="340" height="74" rx="10" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1.5"/>
<text x="760.0" y="637.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">api_request or code step</text>
<text x="760.0" y="656.0" text-anchor="middle" font-size="12" fill="#9da7b3">the engine runs the call or the code itself,</text>
<text x="760.0" y="673.0" text-anchor="middle" font-size="12" fill="#9da7b3">then routes on, deterministic conditions only</text>
<rect x="70" y="740" width="340" height="65" rx="10" fill="#161b22"/><rect x="70" y="740" width="340" height="65" rx="10" fill="#8b949e" fill-opacity="0.13" stroke="#8b949e" stroke-width="1.5"/>
