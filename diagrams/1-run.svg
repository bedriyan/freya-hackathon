<text x="500.0" y="117.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">python3 build.py {case_folder} {mock_url}</text>
<text x="500.0" y="136.0" text-anchor="middle" font-size="12" fill="#9da7b3">case: folder or zip with Markdown, Word, Excel, PDF</text>
<rect x="90" y="178" width="400" height="65" rx="10" fill="#161b22"/><rect x="90" y="178" width="400" height="65" rx="10" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1.5"/>
<text x="290.0" y="207.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Stage the inputs</text>
<text x="290.0" y="226.0" text-anchor="middle" font-size="12" fill="#9da7b3">fresh temp work folder, .txt copies, BRIEF first</text>
<rect x="570" y="178" width="370" height="71" rx="10" fill="#161b22"/><rect x="570" y="178" width="370" height="71" rx="10" fill="#a371f7" fill-opacity="0.13" stroke="#a371f7" stroke-width="1.5"/>
<text x="755.0" y="201.5" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Contract session</text>
<text x="755.0" y="220.5" text-anchor="middle" font-size="12" fill="#9da7b3">only when the case has no tool API file:</text>
<text x="755.0" y="237.5" text-anchor="middle" font-size="12" fill="#9da7b3">Claude Opus writes it from the service contract</text>
<rect x="90" y="318" width="400" height="99" rx="10" fill="#161b22"/><rect x="90" y="318" width="400" height="99" rx="10" fill="#a371f7" fill-opacity="0.13" stroke="#a371f7" stroke-width="1.5"/>
<text x="290.0" y="347.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Build session</text>
<text x="290.0" y="366.0" text-anchor="middle" font-size="12" fill="#9da7b3">Claude Opus + skill build-phone-agent</text>
<text x="290.0" y="383.0" text-anchor="middle" font-size="12" fill="#9da7b3">rules.md → gen.py → workflow.json, selftest.py</text>
<text x="290.0" y="400.0" text-anchor="middle" font-size="12" fill="#9da7b3">static check and a model-free run inside the turn</text>
<rect x="510" y="318" width="400" height="99" rx="10" fill="#161b22"/><rect x="510" y="318" width="400" height="99" rx="10" fill="#a371f7" fill-opacity="0.13" stroke="#a371f7" stroke-width="1.5"/>
<text x="710.0" y="347.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Case writer</text>
<text x="710.0" y="366.0" text-anchor="middle" font-size="12" fill="#9da7b3">Claude Opus, own empty folder</text>
<text x="710.0" y="383.0" text-anchor="middle" font-size="12" fill="#9da7b3">about 28 test customers from the brief alone</text>
<text x="710.0" y="400.0" text-anchor="middle" font-size="12" fill="#9da7b3">coverage counted, one more turn for the gaps</text>
<rect x="90" y="518" width="400" height="68" rx="10" fill="#161b22"/><rect x="90" y="518" width="400" height="68" rx="10" fill="#58a6ff" fill-opacity="0.13" stroke="#58a6ff" stroke-width="1.5"/>
<text x="290.0" y="540.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Local test, round 0</text>
<text x="290.0" y="559.0" text-anchor="middle" font-size="12" fill="#9da7b3">every customer × 3 runs, up to 30 calls at once</text>
<text x="290.0" y="576.0" text-anchor="middle" font-size="12" fill="#9da7b3">local engine and bank, customer and judge models</text>
<rect x="510" y="518" width="400" height="68" rx="10" fill="#161b22"/><rect x="510" y="518" width="400" height="68" rx="10" fill="#f0883e" fill-opacity="0.13" stroke="#f0883e" stroke-width="1.5"/>
<text x="710.0" y="540.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Platform dry run</text>
<text x="710.0" y="559.0" text-anchor="middle" font-size="12" fill="#9da7b3">Freya is asked whether it accepts the file</text>
<text x="710.0" y="576.0" text-anchor="middle" font-size="12" fill="#9da7b3">nothing is saved</text>
<rect x="200" y="650" width="500" height="74" rx="10" fill="#161b22"/><rect x="200" y="650" width="500" height="74" rx="10" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1.5"/>
<text x="450.0" y="675.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Model-free test</text>
<text x="450.0" y="694.0" text-anchor="middle" font-size="12" fill="#9da7b3">about 1,000 calls without any model:</text>
<text x="450.0" y="711.0" text-anchor="middle" font-size="12" fill="#9da7b3">random, stuck customers, recorded calls replayed and disturbed</text>
<rect x="300" y="768" width="300" height="44" rx="22.0" fill="#161b22"/><rect x="300" y="768" width="300" height="44" rx="22.0" fill="#d29922" fill-opacity="0.13" stroke="#d29922" stroke-width="1.5"/>
<text x="450.0" y="795.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Failures, and budget left?</text>
<rect x="720" y="742" width="230" height="96" rx="10" fill="#161b22"/><rect x="720" y="742" width="230" height="96" rx="10" fill="#a371f7" fill-opacity="0.13" stroke="#a371f7" stroke-width="1.5"/>
<text x="835.0" y="769.5" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Repair loop</text>
<text x="835.0" y="788.5" text-anchor="middle" font-size="12" fill="#9da7b3">turns of at most 270 s</text>
<text x="835.0" y="805.5" text-anchor="middle" font-size="12" fill="#9da7b3">checkpoint after each fix</text>
<text x="835.0" y="822.5" text-anchor="middle" font-size="12" fill="#9da7b3">then the tests again</text>
<rect x="250" y="852" width="400" height="65" rx="10" fill="#161b22"/><rect x="250" y="852" width="400" height="65" rx="10" fill="#f0883e" fill-opacity="0.13" stroke="#f0883e" stroke-width="1.5"/>
<text x="450.0" y="881.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Deliver the best tested version</text>
<text x="450.0" y="900.0" text-anchor="middle" font-size="12" fill="#9da7b3">saved to Freya and exported</text>
<rect x="730" y="852" width="220" height="65" rx="10" fill="#161b22"/><rect x="730" y="852" width="220" height="65" rx="10" fill="#8b949e" fill-opacity="0.13" stroke="#8b949e" stroke-width="1.5"/>
<text x="840.0" y="872.5" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">out/&lt;slot&gt;/</text>
<text x="840.0" y="891.5" text-anchor="middle" font-size="12" fill="#9da7b3">workflow.json, trace.txt,</text>
<text x="840.0" y="908.5" text-anchor="middle" font-size="12" fill="#9da7b3">build-report.json</text>
