<rect x="110" y="96" width="340" height="65" rx="10" fill="#161b22"/><rect x="110" y="96" width="340" height="65" rx="10" fill="#58a6ff" fill-opacity="0.13" stroke="#58a6ff" stroke-width="1.5"/>
<text x="280.0" y="125.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Test round N is scored</text>
<text x="280.0" y="144.0" text-anchor="middle" font-size="12" fill="#9da7b3">failed customers + model-free defect groups</text>
<rect x="110" y="194" width="340" height="99" rx="10" fill="#161b22"/><rect x="110" y="194" width="340" height="99" rx="10" fill="#d29922" fill-opacity="0.13" stroke="#d29922" stroke-width="1.5"/>
<text x="280.0" y="223.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Stop here?</text>
<text x="280.0" y="242.0" text-anchor="middle" font-size="12" fill="#9da7b3">every customer passes × 3, model-free clean</text>
<text x="280.0" y="259.0" text-anchor="middle" font-size="12" fill="#9da7b3">2 rounds in a row without gain</text>
<text x="280.0" y="276.0" text-anchor="middle" font-size="12" fill="#9da7b3">no budget for a round (320 s first, 290 s later)</text>
<rect x="110" y="340" width="340" height="65" rx="10" fill="#161b22"/><rect x="110" y="340" width="340" height="65" rx="10" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1.5"/>
<text x="280.0" y="369.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Baseline checkpoint</text>
<text x="280.0" y="388.0" text-anchor="middle" font-size="12" fill="#9da7b3">the level a fix must not fall below</text>
<rect x="110" y="436" width="340" height="99" rx="10" fill="#161b22"/><rect x="110" y="436" width="340" height="99" rx="10" fill="#a371f7" fill-opacity="0.13" stroke="#a371f7" stroke-width="1.5"/>
<text x="280.0" y="465.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Repair turn, at most 270 s</text>
<text x="280.0" y="484.0" text-anchor="middle" font-size="12" fill="#9da7b3">the same build session</text>
<text x="280.0" y="501.0" text-anchor="middle" font-size="12" fill="#9da7b3">reads tests-N.md and fuzz-N.md</text>
<text x="280.0" y="518.0" text-anchor="middle" font-size="12" fill="#9da7b3">one fix in gen.py → checkpoint → next fix</text>
<rect x="110" y="580" width="340" height="74" rx="10" fill="#161b22"/><rect x="110" y="580" width="340" height="74" rx="10" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1.5"/>
<text x="280.0" y="605.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Take the LAST CHECKPOINT</text>
<text x="280.0" y="624.0" text-anchor="middle" font-size="12" fill="#9da7b3">not the files as the turn left them:</text>
<text x="280.0" y="641.0" text-anchor="middle" font-size="12" fill="#9da7b3">a turn cut off by the clock loses nothing</text>
<rect x="110" y="692" width="340" height="65" rx="10" fill="#161b22"/><rect x="110" y="692" width="340" height="65" rx="10" fill="#58a6ff" fill-opacity="0.13" stroke="#58a6ff" stroke-width="1.5"/>
<text x="280.0" y="721.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Test round N+1</text>
<text x="280.0" y="740.0" text-anchor="middle" font-size="12" fill="#9da7b3">local simulator × 3, then the model-free test</text>
<rect x="110" y="790" width="340" height="65" rx="10" fill="#161b22"/><rect x="110" y="790" width="340" height="65" rx="10" fill="#f0883e" fill-opacity="0.13" stroke="#f0883e" stroke-width="1.5"/>
<text x="280.0" y="819.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Deliver the best round</text>
<text x="280.0" y="838.0" text-anchor="middle" font-size="12" fill="#9da7b3">most customers, then fewest model-free groups</text>
<rect x="590" y="146" width="332" height="65" rx="10" fill="#161b22"/><rect x="590" y="146" width="332" height="65" rx="10" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1.5"/>
<text x="756.0" y="175.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Run gen.py</text>
<text x="756.0" y="194.0" text-anchor="middle" font-size="12" fill="#9da7b3">writes workflow.json</text>
<rect x="590" y="240" width="332" height="65" rx="10" fill="#161b22"/><rect x="590" y="240" width="332" height="65" rx="10" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1.5"/>
<text x="756.0" y="269.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">check_workflow.py</text>
<text x="756.0" y="288.0" text-anchor="middle" font-size="12" fill="#9da7b3">static check of the file</text>
<rect x="590" y="334" width="332" height="65" rx="10" fill="#161b22"/><rect x="590" y="334" width="332" height="65" rx="10" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1.5"/>
<text x="756.0" y="363.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">selftest.py</text>
<text x="756.0" y="382.0" text-anchor="middle" font-size="12" fill="#9da7b3">unit tests of the brief's rules</text>
<rect x="590" y="428" width="332" height="65" rx="10" fill="#161b22"/><rect x="590" y="428" width="332" height="65" rx="10" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1.5"/>
<text x="756.0" y="457.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">60 random calls + replay</text>
<text x="756.0" y="476.0" text-anchor="middle" font-size="12" fill="#9da7b3">the recorded calls that passed must still pass</text>
<rect x="610" y="528" width="292" height="44" rx="22.0" fill="#161b22"/><rect x="610" y="528" width="292" height="44" rx="22.0" fill="#d29922" fill-opacity="0.13" stroke="#d29922" stroke-width="1.5"/>
<text x="756.0" y="555.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Worse than the last checkpoint?</text>
<rect x="590" y="618" width="156" height="65" rx="10" fill="#161b22"/><rect x="590" y="618" width="156" height="65" rx="10" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1.5"/>
<text x="668.0" y="647.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">SAVED</text>
<text x="668.0" y="666.0" text-anchor="middle" font-size="12" fill="#9da7b3">copied to ckpt/</text>
<rect x="766" y="618" width="156" height="65" rx="10" fill="#161b22"/><rect x="766" y="618" width="156" height="65" rx="10" fill="#f85149" fill-opacity="0.13" stroke="#f85149" stroke-width="1.5"/>
<text x="844.0" y="647.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">NOT SAVED</text>
<text x="844.0" y="666.0" text-anchor="middle" font-size="12" fill="#9da7b3">fix it, or undo</text>
<rect x="266.9" y="305.0" width="26.2" height="20" rx="10" fill="#0d1117" stroke="#30363d"/><text x="280.0" y="319.0" text-anchor="middle" font-size="11" fill="#e6edf3">no</text>
<rect x="224.2" y="661.5" width="111.6" height="20" rx="10" fill="#0d1117" stroke="#30363d"/><text x="280.0" y="675.5" text-anchor="middle" font-size="11" fill="#e6edf3">workflow changed</text>
<rect x="24.5" y="410.0" width="75.0" height="20" rx="10" fill="#0d1117" stroke="#30363d"/><text x="62.0" y="424.0" text-anchor="middle" font-size="11" fill="#e6edf3">next round</text>
<rect x="471.9" y="370.0" width="32.3" height="20" rx="10" fill="#0d1117" stroke="#30363d"/><text x="488.0" y="384.0" text-anchor="middle" font-size="11" fill="#e6edf3">yes</text>
<rect x="421.1" y="663.0" width="129.9" height="20" rx="10" fill="#0d1117" stroke="#30363d"/><text x="486.0" y="677.0" text-anchor="middle" font-size="11" fill="#e6edf3">nothing new to test</text>
<rect x="654.9" y="584.0" width="26.2" height="20" rx="10" fill="#0d1117" stroke="#30363d"/><text x="668.0" y="598.0" text-anchor="middle" font-size="11" fill="#e6edf3">no</text>
<rect x="827.9" y="584.0" width="32.3" height="20" rx="10" fill="#0d1117" stroke="#30363d"/><text x="844.0" y="598.0" text-anchor="middle" font-size="11" fill="#e6edf3">yes</text>
<rect x="453.8" y="475.3" width="99.4" height="20" rx="10" fill="#0d1117" stroke="#30363d"/><text x="503.5" y="489.3" text-anchor="middle" font-size="11" fill="#e6edf3">after each fix</text>
<text x="756" y="760" text-anchor="middle" font-size="12" fill="#9da7b3">What is tested and delivered after a turn is the last SAVED checkpoint.</text>
<text x="756" y="780" text-anchor="middle" font-size="12" fill="#9da7b3">Every tested round is kept as workflow.rN.json: a repair that made</text>
<text x="756" y="797" text-anchor="middle" font-size="12" fill="#9da7b3">things worse costs nothing, the earlier round is delivered.</text>
<rect x="32" y="866" width="12" height="12" rx="3" fill="#a371f7" fill-opacity="0.25" stroke="#a371f7" stroke-width="1.5"/><text x="50" y="877" font-size="11" fill="#9da7b3">Claude session or model role</text>
<rect x="240.0" y="866" width="12" height="12" rx="3" fill="#3fb950" fill-opacity="0.25" stroke="#3fb950" stroke-width="1.5"/><text x="258.0" y="877" font-size="11" fill="#9da7b3">plain Python, no model</text>
<rect x="412.0" y="866" width="12" height="12" rx="3" fill="#58a6ff" fill-opacity="0.25" stroke="#58a6ff" stroke-width="1.5"/><text x="430.0" y="877" font-size="11" fill="#9da7b3">simulation / test round</text>
<rect x="590.0" y="866" width="12" height="12" rx="3" fill="#f0883e" fill-opacity="0.25" stroke="#f0883e" stroke-width="1.5"/><text x="608.0" y="877" font-size="11" fill="#9da7b3">Freya platform</text>
<rect x="714.0" y="866" width="12" height="12" rx="3" fill="#d29922" fill-opacity="0.25" stroke="#d29922" stroke-width="1.5"/><text x="732.0" y="877" font-size="11" fill="#9da7b3">decision</text>
</svg>
