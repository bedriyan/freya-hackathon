<rect width="1000" height="900" rx="16" fill="#0d1117"/><rect x="0.5" y="0.5" width="999" height="899" rx="16" fill="none" stroke="#30363d"/>
<text x="32" y="42" font-size="20" font-weight="700" fill="#e6edf3">The repair loop and its checkpoints</text>
<text x="32" y="64" font-size="13" fill="#9da7b3">A repair turn is short because a re-test tells more than a longer turn. No fixed number of rounds.</text>
<rect x="560" y="110" width="392" height="600" rx="14" fill="#ffffff" fill-opacity="0.025" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="578" y="99" width="353.8" height="22" rx="11" fill="#0d1117" stroke="#3fb950" stroke-width="1.2"/><text x="754.9" y="114" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="0.8" fill="#e6edf3">checkpoint.py · AFTER EVERY FIX · NO MODEL</text>
